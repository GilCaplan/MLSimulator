name: CI
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vite build

  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install scikit-learn xgboost lightgbm imbalanced-learn pandas numpy openpyxl fastapi joblib pillow
      - name: Lesson challenges are present and solvable
        run: PYTHONPATH=. python scripts/validate_lessons.py --seeds 7,11 --no-torch   # image lessons need torch; run locally
